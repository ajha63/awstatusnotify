[project]
name = "awstatusnotify"
version = "0.1.0"
description = "AWS Service Health Dashboard notifier — fase local"
requires-python = ">=3.12"
dependencies = [
    "feedparser==6.0.11",
]

[project.optional-dependencies]
dev = [
    "ruff==0.5.7",
    "mypy==1.11.1",
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/adapters/"]

[[tool.mypy.overrides]]
module = "src.adapters.*"
# Los adapters pueden usar type: ignore puntual cuando las librerías
# de terceros (feedparser) no tienen stubs completos.
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
